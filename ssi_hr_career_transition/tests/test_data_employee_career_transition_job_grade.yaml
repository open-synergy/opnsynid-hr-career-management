setup:
  steps:
    - step: "Create job grade G1"
      action: "create"
      model: "hr.job_grade"
      save_as: "grade_g1"
      values:
        name: "Test Grade G1"
        code: "/"

    - step: "Create job grade G2"
      action: "create"
      model: "hr.job_grade"
      save_as: "grade_g2"
      values:
        name: "Test Grade G2"
        code: "/"

    - step: "Create transition type that changes job grade"
      action: "create"
      model: "employee_career_transition_type"
      save_as: "type_grade"
      values:
        name: "Test Grade Change Type"
        code: "/"
        change_job_grade: true

    - step: "Create transition type that requires job grade"
      action: "create"
      model: "employee_career_transition_type"
      save_as: "type_require"
      values:
        name: "Test Grade Require Type"
        code: "/"
        change_job_grade: true
        require_job_grade: true

    - step: "Create employee using career transition method"
      action: "create"
      model: "hr.employee"
      save_as: "employee_ct"
      values:
        name: "Test Grade Employee Career"
        work_information_method: "career_transition"
        manual_job_grade_id: "REC: grade_g1.id"

    - step: "Create employee using manual method with grade G1"
      action: "create"
      model: "hr.employee"
      save_as: "employee_manual"
      values:
        name: "Test Grade Employee Manual"
        work_information_method: "manual"
        manual_job_grade_id: "REC: grade_g1.id"

scenarios:
  - name: "Onchange copies employee grade into previous and new grade"
    steps:
      - step: "Select the employee on a new transition form"
        action: "form"
        model: "employee_career_transition"
        as_user: "base.user_admin"
        save: false
        values:
          employee_id: "REC: employee_manual"
        asserts:
          previous_job_grade_id:
            type: "m2o"
            expected: "REC: grade_g1"
          new_job_grade_id:
            type: "m2o"
            expected: "REC: grade_g1"

  - name: "Done transition sets grade for career transition employee"
    steps:
      - step: "Create career job grade transition in draft"
        action: "create"
        model: "employee_career_transition"
        save_as: "transition"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_ct.id"
          type_id: "REC: type_grade.id"
          effective_date: "2026-01-01"
          new_job_grade_id: "REC: grade_g2.id"

      - step: "Confirm the transition"
        action: "call"
        target: "transition"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the transition so it reaches done"
        action: "call"
        target: "transition"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert employee job grade follows the transition"
        action: "assert"
        target: "employee_ct"
        refresh: true
        asserts:
          job_grade_id:
            type: "m2o"
            expected: "REC: grade_g2"

  - name: "Manual method keeps manual grade after done transition"
    steps:
      - step: "Create manual job grade transition in draft"
        action: "create"
        model: "employee_career_transition"
        save_as: "transition"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_manual.id"
          type_id: "REC: type_grade.id"
          effective_date: "2026-01-01"
          new_job_grade_id: "REC: grade_g2.id"

      - step: "Confirm the transition"
        action: "call"
        target: "transition"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the transition so it reaches done"
        action: "call"
        target: "transition"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert employee keeps the manual grade"
        action: "assert"
        target: "employee_manual"
        refresh: true
        asserts:
          job_grade_id:
            type: "m2o"
            expected: "REC: grade_g1"

  - name: "Switching method to career transition follows latest transition"
    steps:
      - step: "Create switch job grade transition in draft"
        action: "create"
        model: "employee_career_transition"
        save_as: "transition"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_manual.id"
          type_id: "REC: type_grade.id"
          effective_date: "2026-01-01"
          new_job_grade_id: "REC: grade_g2.id"

      - step: "Confirm the transition"
        action: "call"
        target: "transition"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the transition so it reaches done"
        action: "call"
        target: "transition"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Switch the employee to career transition method"
        action: "write"
        target: "employee_manual"
        values:
          work_information_method: "career_transition"

      - step: "Assert employee job grade follows the transition"
        action: "assert"
        target: "employee_manual"
        refresh: true
        asserts:
          job_grade_id:
            type: "m2o"
            expected: "REC: grade_g2"

  - name: "Required job grade type rejects an empty new grade"
    steps:
      - step: "Saving the form without new grade is refused"
        action: "form"
        model: "employee_career_transition"
        as_user: "base.user_admin"
        expect_error:
          type: "AssertionError"
          message_contains: "new_job_grade_id"
        ops:
          - set: {employee_id: "REC: employee_manual"}
          - set: {type_id: "REC: type_require"}
          - set: {new_job_grade_id: false}

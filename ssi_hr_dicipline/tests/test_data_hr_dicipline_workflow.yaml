options:
  auto_refresh: true

setup:
  steps:
    - step: "Create dicipline type"
      action: "create"
      model: "hr.dicipline_type"
      save_as: "dicipline_type"
      as_user: "base.user_admin"
      values:
        name: "Test Workflow Type"
        code: "/"

    - step: "Create dicipline reason"
      action: "create"
      model: "hr.dicipline_reason"
      save_as: "dicipline_reason"
      as_user: "base.user_admin"
      values:
        name: "Test Workflow Reason"
        code: "/"

    - step: "Create employee"
      action: "create"
      model: "hr.employee"
      save_as: "employee"
      as_user: "base.user_admin"
      values:
        name: "Test Dicipline Employee"

    - step: "Create global cancel reason"
      action: "create"
      model: "base.cancel_reason"
      save_as: "cancel_reason"
      as_user: "base.user_admin"
      values:
        name: "Test Dicipline Cancel Reason"
        code: "TESTDICCANCEL"
        global_use: true

scenarios:
  - name: "Approve flow: draft, confirm, approve, done with a document number"
    steps:
      - step: "Create draft dicipline"
        action: "create"
        model: "hr.dicipline"
        save_as: "dicipline"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: dicipline_type.id"
          reason_ids: [[6, 0, ["REC: dicipline_reason.id"]]]
          date: 2026-02-01
          date_start: 2026-02-01
          date_end: 2026-03-01
      - step: "Assert state is draft"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"
      - step: "Confirm the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Assert state is confirm"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Assert numbered document"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          name:
            type: "value"
            operator: "!="
            expected: "/"

  - name: "Reject flow: confirm, reject, then restart to draft"
    steps:
      - step: "Create draft dicipline"
        action: "create"
        model: "hr.dicipline"
        save_as: "dicipline"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: dicipline_type.id"
          reason_ids: [[6, 0, ["REC: dicipline_reason.id"]]]
          date: 2026-02-01
          date_start: 2026-02-01
          date_end: 2026-03-01
      - step: "Confirm the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Assert state is confirm"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Reject the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "reject"
      - step: "Assert state is reject"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "reject"
      - step: "Restart the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_restart"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Cancel flow: draft cancelled through the reason wizard"
    steps:
      - step: "Create draft dicipline"
        action: "create"
        model: "hr.dicipline"
        save_as: "dicipline"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: dicipline_type.id"
          reason_ids: [[6, 0, ["REC: dicipline_reason.id"]]]
          date: 2026-02-01
          date_start: 2026-02-01
          date_end: 2026-03-01
      - step: "Cancel through the select reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "dicipline"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Negative: saving the form without a reason is refused"
    steps:
      - step: "Saving the form without reason is refused"
        action: "form"
        model: "hr.dicipline"
        as_user: "base.user_admin"
        expect_error:
          type: "AssertionError"
          message_contains: "reason_ids is a required field"
        ops:
          - set: {employee_id: "REC: employee"}
          - set: {type_id: "REC: dicipline_type"}
          - set: {date: "2026-02-01"}
          - set: {date_start: "2026-02-01"}
          - set: {date_end: "2026-03-01"}

  - name: "Negative: a user who is not an approver cannot approve"
    steps:
      - step: "Create a plain internal user"
        action: "create"
        model: "res.users"
        save_as: "plain_user"
        values:
          name: "Test Dicipline Plain User"
          login: "test_dicipline_plain_user"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Create draft dicipline"
        action: "create"
        model: "hr.dicipline"
        save_as: "dicipline"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: dicipline_type.id"
          reason_ids: [[6, 0, ["REC: dicipline_reason.id"]]]
          date: 2026-02-01
          date_start: 2026-02-01
          date_end: 2026-03-01
      - step: "Confirm the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Assert state is confirm"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve as a user without approval right is refused"
        action: "call"
        target: "dicipline"
        method: "action_approve_approval"
        as_user: "plain_user"
        expect_error:
          type: "UserError"
          message_contains: "not allowed to approve"

      - step: "Assert state is confirm"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

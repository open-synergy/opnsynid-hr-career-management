options:
  auto_refresh: true

setup:
  steps:
    - step: "Create dicipline type"
      action: "create"
      model: "hr.dicipline_type"
      save_as: "dicipline_type"
      as_user: "base.user_admin"
      values:
        name: "Test Documenso Type"
        code: "/"

    - step: "Create dicipline reason"
      action: "create"
      model: "hr.dicipline_reason"
      save_as: "dicipline_reason"
      as_user: "base.user_admin"
      values:
        name: "Test Documenso Reason"
        code: "/"

    - step: "Create employee"
      action: "create"
      model: "hr.employee"
      save_as: "employee"
      as_user: "base.user_admin"
      values:
        name: "Test Documenso Employee"

scenarios:
  - name: "Confirm flow: draft to confirm keeps the Documenso fields empty"
    steps:
      - step: "Create draft dicipline"
        action: "create"
        model: "hr.dicipline"
        save_as: "dicipline"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: dicipline_type.id"
          reason_ids: [[6, 0, ["REC: dicipline_reason.id"]]]
          date: 2026-02-01
          date_start: 2026-02-01
          date_end: 2026-03-01
      - step: "Assert draft state and empty Documenso fields"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"
          approval_signature_request_id:
            type: "value"
            operator: "is_falsy"
          signature_request_count:
            type: "value"
            expected: 0
      - step: "Confirm the dicipline"
        action: "call"
        target: "dicipline"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Assert confirm state and no signature request created"
        action: "assert"
        target: "dicipline"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
          approval_signature_request_id:
            type: "value"
            operator: "is_falsy"
          signature_request_count:
            type: "value"
            expected: 0
